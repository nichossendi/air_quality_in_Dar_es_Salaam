name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: lint step removed after repeated CI/local mismatch issues on
      # tests/test_wrangle.py (unresolved editor/sync conflict).

      # NOTE: seeding needs data/dar-es-salaam.json, which is gitignored.
      - name: Run tests
        run: pytest -v
